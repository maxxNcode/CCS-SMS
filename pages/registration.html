<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Registration</title>
    <style>

    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <img src="../assets/ccslogo.png" alt="" height="50">
            <p>CCS - Sitin Monitoring System</p>
        </div>

        <div class="links">
            <a href="">Home</a>
            <a href="">Community</a>
            <a href="">About</a>
            <a href="">Login</a>
            <a href="pages/registration.html">Register</a>
        </div>
    </nav>

    <div class="main">
        <div class="left-holder">
            <div class="regis-title">
                Create Your Account
            </div>

            <input type="text">
            <label for="">ID Number</label>
            <div class="small-space"></div>
            <input type="text">
            <label for="">Last Name</label>
            <div class="small-space"></div>
            <input type="text">
            <label for="">First Name</label>
            <div class="small-space"></div>
            <input type="text">
            <label for="">Middle Name</label>
            <div class="small-space"></div>
            <input type="text">
            <label for="">Course Level</label>
        </div>

        <div class="right-holder">
            <input type="text">
            <label for="">Course</label>
            <div class="small-space"></div>
            <input type="text">
            <label for="">Address</label>
            <div class="small-space"></div>
            <input type="text">
            <label for="">Email</label>
            <div class="small-space"></div>
            <input type="text">
            <label for="">Password</label>
            <div class="small-space"></div>
            <input type="text">
            <label for="">Repeat your password</label>

            <div class="submit-holder">
                <button>Register</button>
            </div>
        </div>
