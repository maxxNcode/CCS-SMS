<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <title>Registration</title>
    <style>

    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <img src="../assets/ccslogo.png" alt="" height="50">
            <p>CCS - Sitin Monitoring System</p>
        </div>

        <div class="links">
            <a href="../index.html">Home</a>
            <a href="">Community</a>
            <a href="">About</a>
            <a href="">Login</a>
            <a href="pages/registration.html">Register</a>
        </div>
    </nav>

    <div class="main">
        <div class="create-account animate__animated animate__fadeInUp">
            <div class="regis-title">
                Create Your Account
            </div>
            <div class="form">
                <div class="left-holder">
                    <input type="text">
                    <label for="">ID Number</label>
                    <div class="small-space"></div>
                    <input type="text">
                    <label for="">Last Name</label>
                    <div class="small-space"></div>
                    <input type="text">
                    <label for="">First Name</label>
                    <div class="small-space"></div>
                    <input type="text">
                    <label for="">Middle Name</label>
                    <div class="small-space"></div>
                    <input type="text">
                    <label for="">Course Level</label>
                </div>

                <div class="right-holder">
                    <input type="text">
                    <label for="">Course</label>
                    <div class="small-space"></div>
                    <input type="text">
                    <label for="">Address</label>
                    <div class="small-space"></div>
                    <input type="text">
                    <label for="">Email</label>
                    <div class="small-space"></div>
                    <input type="text">
                    <label for="">Password</label>
                    <div class="small-space"></div>
                    <input type="text">
                    <label for="">Repeat your password</label>
                </div>
            </div>
            
            <div class="actions">
                <div class="btn-holder">
                        <button class="cancel-btn"><a href="../index.html">Cancel</a></button>
                </div>

                <div class="btn-holder">
                        <button class="register-btn">Register</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
